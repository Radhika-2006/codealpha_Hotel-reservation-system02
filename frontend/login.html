<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Grand Horizon Hotel Jaipur</title>
  
  <!-- Protection: Redirect logged-in users back to home -->
  <script>
    if (localStorage.getItem("isLoggedIn") === "true") {
      window.location.href = "index.html";
    }
  </script>
  
  <!-- Link to the shared premium stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-dark); padding: 1.5rem; margin: 0; font-family: 'Outfit', 'Inter', sans-serif;">

  <div class="booking-container" style="max-width: 450px; width: 100%; padding: 2.5rem; background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); text-align: left;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="font-size: 1.8rem; color: var(--text-white); margin-bottom: 0.5rem; font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 2px;">
        Grand <span style="color: var(--accent-gold);">Horizon Jaipur</span>
      </h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to manage your premium reservations</p>
    </div>

    <!-- 1. Send OTP / Login Entry Section -->
    <div id="loginSection">
      <form id="loginForm" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
          <label for="fullName" style="font-size: 0.85rem; color: var(--text-white); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your full name" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.25); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-white); font-size: 0.95rem; outline: none; transition: border-color 0.3s;" onfocus="this.style.borderColor='var(--accent-gold)'" onblur="this.style.borderColor='var(--border-color)'">
          <span class="error-msg" id="nameError" style="font-size: 0.8rem; color: #ff6b6b; display: none; margin-top: 0.2rem;"></span>
        </div>

        <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
          <label for="phoneNum" style="font-size: 0.85rem; color: var(--text-white); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">Phone Number</label>
          <input type="tel" id="phoneNum" placeholder="10-digit mobile number" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.25); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-white); font-size: 0.95rem; outline: none; transition: border-color 0.3s;" onfocus="this.style.borderColor='var(--accent-gold)'" onblur="this.style.borderColor='var(--border-color)'">
          <span class="error-msg" id="phoneError" style="font-size: 0.8rem; color: #ff6b6b; display: none; margin-top: 0.2rem;"></span>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 0.5rem; width: 100%; padding: 0.75rem 1rem;">Send OTP</button>
      </form>
    </div>

    <!-- 2. OTP Code Verification Section (Hidden initially) -->
    <div id="otpSection" style="display: none;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <p style="color: var(--text-muted); font-size: 0.9rem;">We have sent a verification code to <span id="displayPhone" style="color: var(--text-white); font-weight: 600;"></span></p>
      </div>

      <form id="otpForm" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem; text-align: left;">
          <label for="otpCode" style="font-size: 0.85rem; color: var(--text-white); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">Enter 6-Digit OTP</label>
          <input type="text" id="otpCode" maxlength="6" placeholder="------" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.25); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-white); font-size: 1.25rem; text-align: center; letter-spacing: 8px; outline: none; transition: border-color 0.3s; font-weight: 700;" onfocus="this.style.borderColor='var(--accent-gold)'" onblur="this.style.borderColor='var(--border-color)'">
          <span class="error-msg" id="otpError" style="font-size: 0.8rem; color: #ff6b6b; display: none; margin-top: 0.2rem;"></span>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;">
          <span id="timerText" style="color: var(--text-muted);">Resend code in <strong id="timerVal" style="color: var(--accent-gold);">30</strong>s</span>
          <button type="button" id="resendOtpBtn" style="background: none; border: none; color: var(--accent-gold); cursor: pointer; font-weight: 600; padding: 0; outline: none; display: none;">Resend OTP</button>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 0.5rem; width: 100%; padding: 0.75rem 1rem;">Verify &amp; Log In</button>
      </form>
    </div>

  </div>

  <script src="login.js"></script>
</body>
</html>
